<!doctype html>
<!--
  Esta página é o painel de edição da IBMAC.
  O Decap CMS carrega o painel e o Netlify Identity
  controla a autenticação dos usuários.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de edição - Igreja Águas Compridas</title>
</head>

<body>

  <!-- Netlify Identity: autenticação dos usuários -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS: painel de edição -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    if (window.netlifyIdentity) {

      window.netlifyIdentity.on("init", (user) => {

        // Se não estiver logado, abre automaticamente
        // a tela de login do Netlify Identity.
        if (!user) {
          window.netlifyIdentity.open("login");
        }

      });

      // Depois do login, permanece no painel administrativo.
      window.netlifyIdentity.on("login", () => {
        document.location.href = "/admin/";
      });

    }
  </script>

</body>
</html>
